name: Daily refresh
on:
  schedule:
    - cron: "57 13 * * *"   # 5:57 am Pacific standard time (6:57 am during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the board
        run: python3 board.py
      - name: Publish
        run: |
          git config user.name "plunge-board"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Daily refresh $(TZ=America/Los_Angeles date +%F)"
          git push
