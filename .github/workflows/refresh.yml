name: Daily refresh
on:
  schedule:
    - cron: "17 13 * * *"   # 5:17 am Pacific (backup run)
    - cron: "57 13 * * *"   # 5:57 am Pacific
    - cron: "57 21 * * *"   # 1:57 pm Pacific
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the board with fresh data
        run: python3 board.py
      - name: Save the refreshed page to the repo
        run: |
          git config user.name "plunge-board"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.txt
          git diff --cached --quiet || git commit -m "Daily refresh $(TZ=America/Los_Angeles date +%F)"
          git push
      - name: Package the site
        run: |
          mkdir -p _site
          cp index.html version.txt og.png .nojekyll _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
