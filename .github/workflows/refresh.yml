name: Daily refresh
on:
  schedule:
    - cron: "57 13 * * *"   # 5:57 am Pacific standard time (6:57 am during daylight time)
    - cron: "57 21 * * *"   # 1:57 pm Pacific standard time (2:57 pm during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the board with fresh data
        run: python3 board.py
      - name: Save it (GitHub Pages publishes each saved change automatically)
        run: |
          git config user.name "plunge-board"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.txt records.json
          git diff --cached --quiet || git commit -m "Refresh $(TZ=America/Los_Angeles date '+%F %H:%M')"
          git pull --rebase origin main
          git push
